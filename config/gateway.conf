map $http_upgrade $nextcloud_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $nextcloud_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    location = /.well-known/carddav { return 301 /remote.php/dav/; }
    location = /.well-known/caldav { return 301 /remote.php/dav/; }
    location = /collabora-admin/ { return 302 /browser/dist/admin/admin.html; }

    location ^~ /hosting/ {
        proxy_pass http://nextcloud-office:9980;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $nextcloud_forwarded_proto;
    }

    location ^~ /browser/ {
        proxy_pass http://nextcloud-office:9980;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $nextcloud_forwarded_proto;
    }

    location ^~ /cool/ {
        proxy_pass http://nextcloud-office:9980;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nextcloud_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $nextcloud_forwarded_proto;
    }

    location / {
        proxy_pass http://nextcloud-app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $nextcloud_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
